  <style>

    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #567; pointer-events: none; }
    #status[hidden] { display: none; }
  </style>
</head>

  <canvas id="c"></canvas>
  <div id="status">角色載入中…</div>
